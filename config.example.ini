; ============================================================
;  Чёрный Рассвет — настройки бота
;  Скопируй этот файл в config.ini и впиши свои значения.
;  Файл с паролями никому не показывай и не выкладывай в GitHub.
; ============================================================

[telegram]
; Токен от @BotFather
token = СЮДА_ТОКЕН_БОТА
; Твой Telegram ID числом. Узнать: напиши @userinfobot
; Если админов несколько — через запятую: 111111,222222
admins = СЮДА_ТВОЙ_ID
; Чат, куда падают жалобы и заявки. Оставь пустым — будут приходить
; первому админу из списка выше.
admin_chat =

[server]
; Игровой сервер
ip = 195.60.166.224
port = 27374
; rcon_password из cstrike/server.cfg
rcon_password = СЮДА_RCON_ПАРОЛЬ
; Откуда бот берёт топ и онлайн для команд /top и /rank
top_url = https://cherniirassvet.github.io/data/top.json

[donationalerts]
; Регистрация приложения: donationalerts.com → профиль → «Для разработчиков»
client_id = СЮДА_CLIENT_ID
client_secret = СЮДА_CLIENT_SECRET
; Должен совпадать с тем, что вписан в приложении на сайте
redirect_uri = http://localhost:8080/callback

[shop]
; Слова, по которым бот понимает, что человек покупает.
; Регистр не важен, ищутся как часть текста.
vip_words     = вип,vip
admin_words   = админ,admin
forever_words = навсегда,forever,перман

; Позиции. Формат: дней | цена | валюта
; дней 0 = навсегда, цена 0 = сумму не сверять
vip_month     = 30 | 30  | EUR
vip_forever   = 0  | 90  | EUR
admin_month   = 30 | 60  | EUR
admin_forever = 0  | 150 | EUR

[texts]
; Язык сообщений бота: ru или en
lang = ru
